# Tidy desktop workspace. Everything under desktop/ builds here; nothing lands in top-level bin/.
[workspace]
resolver = "2"
members = [
    "crates/mole-core",
    "crates/mole-macos",
    "crates/mole-helper",
    "crates/mole-ops",
    "src-tauri",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/tw93/mole"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
