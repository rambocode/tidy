# mole-helper: the privileged helper. Ships as an SMAppService-registered
# daemon in the signed app bundle; every request is RE-validated in-process
# (the helper never trusts its caller). Until the signing/registration phase
# lands in release tooling, the transport half is a refusing stub.
[package]
name = "mole-helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mole-core = { path = "../mole-core" }
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
