# mole-ops: feature logic (status/analyze/clean/uninstall/...), built on the
# mole-core safety layer. M1 ships the read-only history/whitelist surfaces;
# feature modules land per milestone.
[package]
name = "mole-ops"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mole-core = { path = "../mole-core" }
mole-macos = { path = "../mole-macos" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
sysinfo = "0.36"
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile.workspace = true
